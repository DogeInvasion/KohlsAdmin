<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Kohl's Admin Simulator</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;

    background:
        linear-gradient(
            rgba(100,150,180,.08),
            rgba(0,0,0,.12)
        ),
        url("https://i.redd.it/i0atxt66h7941.jpg")
        center center / cover no-repeat;

    color:white;
}


/* =========================================================
   TOPBAR
========================================================= */

#topbar{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:36px;

    background:rgba(35,35,35,.74);

    display:flex;
    align-items:center;

    z-index:5000;

    box-shadow:
        0 1px 3px rgba(0,0,0,.55);
}

.topIcon{
    width:38px;
    height:36px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-right:
        1px solid rgba(255,255,255,.07);

    color:white;

    cursor:pointer;

    user-select:none;
}

.topIcon:hover{
    background:rgba(255,255,255,.07);
}

.topIcon img{
    width:22px;
    height:22px;

    object-fit:contain;

    display:block;

    pointer-events:none;
}

#robloxLogo{
    width:52px;
}


/* =========================================================
   LEADERBOARD
========================================================= */

#leaderboard{
    position:fixed;

    top:42px;
    right:7px;

    width:205px;

    z-index:4900;

    color:white;

    font-size:13px;

    text-shadow:
        1px 1px 2px rgba(0,0,0,.8);
}

.leaderHeader{
    height:29px;

    display:grid;

    grid-template-columns:
        1fr 55px;

    align-items:center;

    padding:0 8px;

    background:
        rgba(45,45,45,.68);

    border-bottom:
        1px solid rgba(255,255,255,.12);

    font-weight:bold;
}

.leaderPlayer{
    min-height:29px;

    display:grid;

    grid-template-columns:
        1fr 55px;

    align-items:center;

    padding:0 8px;

    background:
        rgba(55,55,55,.54);

    border-bottom:
        1px solid rgba(255,255,255,.07);
}

.playerName{
    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.playerRank{
    text-align:right;

    color:#ddd;
}


/* =========================================================
   CHAT
   TOP LEFT, BELOW TOPBAR
========================================================= */

#chatPanel{
    position:fixed;

    left:8px;
    top:45px;

    width:430px;
    height:205px;

    background:
        rgba(45,45,45,.48);

    z-index:4500;

    overflow:hidden;
}


/* =========================================================
   CHAT MESSAGES
========================================================= */

#chatMessages{
    position:absolute;

    top:7px;
    left:8px;
    right:8px;

    bottom:36px;

    overflow:hidden;

    display:flex;

    flex-direction:column;

    justify-content:flex-start;

    pointer-events:none;
}

.chatMessage{
    width:max-content;
    max-width:100%;

    color:white;

    font-size:14px;

    line-height:19px;

    margin-bottom:2px;

    padding:
        1px 5px;

    background:
        rgba(65,65,65,.58);

    text-shadow:
        1px 1px 2px #000,
        0 0 2px #000;

    opacity:0;

    transform:
        translateY(6px);

    animation:
        chatAppear .2s forwards;
}

@keyframes chatAppear{

    to{
        opacity:1;

        transform:
            translateY(0);
    }

}

.playerChatName{
    font-weight:bold;
}


/* =========================================================
   CHAT INPUT
   ALWAYS VISIBLE
========================================================= */

#chatInput{
    position:absolute;

    left:0;
    bottom:0;

    width:100%;
    height:36px;

    padding:
        7px 9px;

    border:0;

    border-top:
        1px solid rgba(255,255,255,.09);

    outline:none;

    background:
        rgba(55,55,55,.63);

    color:white;

    font-size:13px;

    display:block;
}

#chatInput::placeholder{
    color:#c7c7c7;
}


/* =========================================================
   FULL SCREEN :M
========================================================= */

#mContainer{
    position:fixed;

    top:36px;
    left:0;
    right:0;
    bottom:0;

    pointer-events:none;

    z-index:3000;
}

.mMessage{
    position:absolute;

    inset:0;

    display:flex;

    align-items:center;
    justify-content:center;

    padding:40px;

    background:
        rgba(65,65,65,.54);

    color:white;

    font-size:25px;

    text-align:center;

    text-shadow:
        2px 2px 3px #000;

    opacity:0;

    animation:
        mIn .2s forwards,
        mOut .5s 4.5s forwards;
}

@keyframes mIn{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }

}

@keyframes mOut{

    from{
        opacity:1;
    }

    to{
        opacity:0;
    }

}


/* =========================================================
   FULL WIDTH :H
========================================================= */

#hContainer{
    position:fixed;

    top:36px;
    left:0;
    right:0;

    width:100%;

    display:flex;

    justify-content:center;

    pointer-events:none;

    z-index:4000;
}

.hMessage{
    width:100%;
    min-width:100%;
    max-width:100%;

    padding:
        8px 20px;

    background:
        rgba(65,65,65,.58);

    border:0;

    color:white;

    font-size:16px;

    text-align:center;

    text-shadow:
        1px 1px 2px #000;

    opacity:0;

    transform:
        translateY(-5px);

    animation:
        hIn .18s forwards,
        hOut .4s 4s forwards;
}

@keyframes hIn{

    to{
        opacity:1;

        transform:
            translateY(0);
    }

}

@keyframes hOut{

    to{
        opacity:0;

        transform:
            translateY(-5px);
    }

}


/* =========================================================
   INVENTORY
========================================================= */

#inventory{
    position:fixed;

    left:50%;
    bottom:7px;

    transform:
        translateX(-50%);

    display:flex;

    gap:2px;

    z-index:4700;
}


/* =========================================================
   INVENTORY SLOT
========================================================= */

.slot{
    position:relative;

    width:52px;
    height:52px;

    background:
        rgba(115,115,115,.62);

    border:0;
    outline:0;

    display:flex;

    align-items:center;
    justify-content:center;

    cursor:pointer;

    box-shadow:none;

    color:white;

    z-index:1;
}


/* Do NOT change the transparency on hover */

.slot:hover{
    background:
        rgba(115,115,115,.62);
}


/* =========================================================
   SELECTED SLOT
   THE OUTLINE IS ITS OWN TOP LAYER
========================================================= */

.slot.selected{
    background:
        rgba(115,115,115,.62);

    border:0;
    outline:0;

    box-shadow:none;

    z-index:20;
}

.slot.selected::after{
    content:"";

    position:absolute;

    inset:0;

    border:
        4px solid #8fd8ff;

    pointer-events:none;

    z-index:100;
}


/* =========================================================
   INVENTORY NUMBER
   TOP LEFT
========================================================= */

.slotNumber{
    position:absolute;

    top:3px;
    left:4px;

    color:white;

    font-size:12px;

    font-weight:bold;

    line-height:12px;

    text-shadow:
        1px 1px 2px #000;

    z-index:5;
}


/* =========================================================
   CENTERED TOOL NAME
========================================================= */

.toolName{
    position:static;

    color:white;

    font-size:11px;

    font-weight:normal;

    text-align:center;

    text-shadow:
        1px 1px 2px #000;

    pointer-events:none;

    max-width:100%;

    padding:3px;
}


/* =========================================================
   IMAGE TOOL
   IF IMAGE EXISTS, NO TEXT IS SHOWN
========================================================= */

.toolImage{
    width:38px;
    height:38px;

    object-fit:contain;

    display:block;

    pointer-events:none;
}


/* =========================================================
   COMMAND BROWSER
========================================================= */

#browser{
    position:fixed;

    top:36px;
    left:0;
    right:0;
    bottom:0;

    background:
        rgba(0,0,0,.30);

    display:none;

    align-items:center;
    justify-content:center;

    z-index:6000;
}

#browserBox{
    width:690px;
    height:490px;

    background:
        rgba(40,40,40,.91);

    border:
        1px solid rgba(255,255,255,.13);

    box-shadow:
        0 4px 18px rgba(0,0,0,.6);

    padding:12px;

    color:white;
}

#browserTitle{
    font-size:17px;

    margin-bottom:4px;
}

#browserHint{
    color:#aaa;

    font-size:11px;

    margin-bottom:8px;
}

#search{
    width:100%;

    height:31px;

    padding:
        6px 8px;

    background:#eee;

    color:#222;

    border:
        1px solid #555;

    outline:none;

    font-size:13px;
}

#commandList{
    height:407px;

    margin-top:8px;

    overflow-y:auto;
}

.command{
    padding:8px;

    border-bottom:
        1px solid rgba(255,255,255,.08);

    cursor:pointer;
}

.command:hover,
.command.selected{
    background:
        rgba(255,255,255,.09);
}

.commandName{
    font-size:14px;

    font-weight:bold;
}

.commandUsage{
    color:#aaa;

    font-size:10px;

    margin-top:2px;
}

.commandDescription{
    color:#ddd;

    font-size:11px;

    margin-top:2px;
}

#commandList::-webkit-scrollbar{
    width:8px;
}

#commandList::-webkit-scrollbar-track{
    background:
        rgba(0,0,0,.2);
}

#commandList::-webkit-scrollbar-thumb{
    background:
        rgba(180,180,180,.45);
}


/* =========================================================
   HELP
========================================================= */

#helpPanel{
    position:fixed;

    left:8px;
    top:255px;

    width:330px;

    padding:9px;

    background:
        rgba(45,45,45,.72);

    color:#ddd;

    font-size:11px;

    border:
        1px solid rgba(255,255,255,.1);

    display:none;

    z-index:4800;
}

#helpPanel b{
    color:white;
}

</style>
</head>

<script>


/* =========================================================
   TOPBAR ICON IMAGES
   =========================================================

   PUT YOUR IMAGE URLS HERE.

   Example:

   logo:
       "https://example.com/logo.png"

   If you leave one as "",
   that icon will simply be invisible.

========================================================= */

const topbarIcons = {

    logo:
        "",

    menu:
        "",

    chat:
        "",

    backpack:
        ""

};


/* =========================================================
   APPLY TOPBAR ICONS
========================================================= */

function setTopbarIcon(
    id,
    url
){

    const element =
        document.querySelector(
            id + " img"
        );


    if(!element){
        return;
    }


    if(url){

        element.src =
            url;

        element.style.display =
            "block";

    }

    else{

        element.style.display =
            "none";

    }

}


/* APPLY THE FOUR ICONS */

setTopbarIcon(
    "#robloxLogo",
    topbarIcons.logo
);

setTopbarIcon(
    "#topIconMenu",
    topbarIcons.menu
);

setTopbarIcon(
    "#topIconChat",
    topbarIcons.chat
);

setTopbarIcon(
    "#topIconBackpack",
    topbarIcons.backpack
);


/* =========================================================
   COMMAND DATA
========================================================= */

const commandData = {

    kill:{
        aliases:["k"],
        usage:"kill [player]",
        description:"Kills a player"
    },

    heal:{
        aliases:["hl"],
        usage:"heal [player]",
        description:"Heals a player"
    },

    speed:{
        aliases:["s"],
        usage:"speed [player] [amount]",
        description:"Sets walkspeed"
    },

    bring:{
        aliases:["br"],
        usage:"bring [player]",
        description:"Brings a player to you"
    },

    tp:{
        aliases:["teleport"],
        usage:"tp [player]",
        description:"Teleports to a player"
    },

    ff:{
        aliases:["forcefield"],
        usage:"ff [player]",
        description:"Gives a forcefield"
    },

    unff:{
        aliases:[],
        usage:"unff [player]",
        description:"Removes a forcefield"
    },

    sparkles:{
        aliases:["sp"],
        usage:"sparkles [player]",
        description:"Adds sparkles"
    },

    unsparkles:{
        aliases:["unsp"],
        usage:"unsparkles [player]",
        description:"Removes sparkles"
    },

    fire:{
        aliases:[],
        usage:"fire [player]",
        description:"Adds fire"
    },

    unfire:{
        aliases:[],
        usage:"unfire [player]",
        description:"Removes fire"
    },

    explode:{
        aliases:["ex"],
        usage:"explode [player]",
        description:"Explodes a player"
    },

    h:{
        aliases:["hint"],
        usage:"h [message]",
        description:"Displays a hint below the topbar"
    },

    m:{
        aliases:["message"],
        usage:"m [message]",
        description:"Displays a full-screen message"
    },

    sword:{
        aliases:[],
        usage:"sword",
        description:"Gives the classic sword"
    },

    f3x:{
        aliases:["f3"],
        usage:"f3x",
        description:"Gives Building Tools"
    },

    btools:{
        aliases:["btool","bt"],
        usage:"btools",
        description:"Gives Delete, Clone and Move tools"
    },

    cmds:{
        aliases:["commands"],
        usage:"cmds",
        description:"Shows the command browser"
    },

    help:{
        aliases:["?"],
        usage:"help",
        description:"Shows general command usage"
    },

    god:{
        aliases:[],
        usage:"god [player]",
        description:"Makes a player invincible"
    },

    fly:{
        aliases:["f"],
        usage:"fly [player]",
        description:"Makes a player fly"
    },

    unfly:{
        aliases:["unf"],
        usage:"unfly [player]",
        description:"Removes flight"
    },

    noclip:{
        aliases:["nc"],
        usage:"noclip [player]",
        description:"Enables noclip"
    },

    clip:{
        aliases:[],
        usage:"clip [player]",
        description:"Disables noclip"
    },

    sit:{
        aliases:[],
        usage:"sit [player]",
        description:"Makes a player sit"
    },

    jump:{
        aliases:[],
        usage:"jump [player]",
        description:"Makes a player jump"
    }

};


/* =========================================================
   ROBLOX-STYLE PLAYER NAME COLOR
========================================================= */

const robloxNameColors = [

    "#F2F2F2",
    "#D7D7D7",
    "#C42828",
    "#E67E22",
    "#F1C40F",
    "#2ECC71",
    "#3498DB",
    "#9B59B6",
    "#E91E63",
    "#795548",
    "#00BCD4",
    "#8BC34A",
    "#FF7043",
    "#7E57C2",
    "#26A69A"

];

const playerColor =
    robloxNameColors[
        Math.floor(
            Math.random() *
            robloxNameColors.length
        )
    ];


/* =========================================================
   ELEMENTS
========================================================= */

const chatMessages =
    document.getElementById(
        "chatMessages"
    );

const input =
    document.getElementById(
        "chatInput"
    );

const browser =
    document.getElementById(
        "browser"
    );

const search =
    document.getElementById(
        "search"
    );

const commandList =
    document.getElementById(
        "commandList"
    );

const inventory =
    document.getElementById(
        "inventory"
    );

const mContainer =
    document.getElementById(
        "mContainer"
    );

const hContainer =
    document.getElementById(
        "hContainer"
    );

const helpPanel =
    document.getElementById(
        "helpPanel"
    );

const cmdSound =
    document.getElementById(
        "cmdSound"
    );


/* =========================================================
   STATE
========================================================= */

let mode = "chat";

let history = [];

let historyIndex = 0;

let tools = [];

let selectedSlot = -1;

let selectedCommand = 0;


/* =========================================================
   HTML ESCAPING
========================================================= */

function escapeHTML(text){

    return String(text)

        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   CHAT MESSAGE
========================================================= */

function addMessage(
    html
){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "chatMessage";

    div.innerHTML =
        html;

    chatMessages.appendChild(
        div
    );


    while(
        chatMessages.children.length > 12
    ){

        chatMessages.removeChild(
            chatMessages.firstChild
        );

    }

}


/* =========================================================
   NORMAL PLAYER MESSAGE
========================================================= */

function playerMessage(
    text
){

    addMessage(

        `<span
            class="playerChatName"
            style="color:${playerColor}"
        >[Player]</span>: ${escapeHTML(text)}`

    );

}


/* =========================================================
   :M
========================================================= */

function showMessage(
    text
){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "mMessage";

    div.textContent =
        text;

    mContainer.appendChild(
        div
    );


    setTimeout(
        ()=>{

            div.remove();

        },
        5100
    );

}


/* =========================================================
   :H
========================================================= */

function showHint(
    text
){

    const div =
        document.createElement(
            "div"
        );

    div.className =
        "hMessage";

    div.textContent =
        text;

    hContainer.appendChild(
        div
    );


    setTimeout(
        ()=>{

            div.remove();

        },
        4500
    );

}


/* =========================================================
   ADD TOOL
========================================================= */

function addTool(
    name,
    type,
    image=null
){

    /*
       Don't give duplicate tools.
    */

    if(
        tools.some(
            tool =>
                tool.name === name
        )
    ){

        return;

    }


    /*
       Maximum 10 slots.
    */

    if(
        tools.length >= 10
    ){

        return;

    }


    tools.push({

        name:name,

        type:type,

        image:image

    });


    renderInventory();

}


/* =========================================================
   RENDER INVENTORY
========================================================= */

function renderInventory(){

    inventory.innerHTML = "";


    tools.forEach(
        (tool,index)=>{

            const slot =
                document.createElement(
                    "div"
                );


            slot.className =
                "slot";


            if(
                index === selectedSlot
            ){

                slot.classList.add(
                    "selected"
                );

            }


            /*
                NUMBER:
                TOP LEFT
            */

            const number =
                document.createElement(
                    "div"
                );

            number.className =
                "slotNumber";

            number.textContent =
                index + 1;

            slot.appendChild(
                number
            );


            /*
                IMAGE TOOL:
                SHOW IMAGE ONLY.
                NEVER SHOW NAME.
            */

            if(
                tool.image
            ){

                const image =
                    document.createElement(
                        "img"
                    );

                image.className =
                    "toolImage";

                image.src =
                    tool.image;

                image.alt =
                    "";

                slot.appendChild(
                    image
                );

            }


            /*
                TEXT TOOL:
                SHOW ONE CENTERED NAME.
            */

            else{

                const name =
                    document.createElement(
                        "div"
                    );

                name.className =
                    "toolName";

                name.textContent =
                    tool.name;

                slot.appendChild(
                    name
                );

            }


            /*
                SELECT / UNSELECT
            */

            slot.addEventListener(
                "click",
                ()=>{

                    if(
                        selectedSlot === index
                    ){

                        selectedSlot =
                            -1;

                    }

                    else{

                        selectedSlot =
                            index;

                    }

                    renderInventory();

                }
            );


            inventory.appendChild(
                slot
            );

        }
    );

}


/* =========================================================
   RESOLVE COMMAND
========================================================= */

function resolveCommand(
    name
){

    name =
        name.toLowerCase();


    if(
        commandData[name]
    ){

        return name;

    }


    for(
        const command in commandData
    ){

        if(
            commandData[command]
                .aliases
                .includes(name)
        ){

            return command;

        }

    }


    return null;

}


/* =========================================================
   COMMAND BROWSER
========================================================= */

function refreshCommands(
    filter=""
){

    commandList.innerHTML = "";


    const value =
        filter
            .toLowerCase()
            .trim();


    const results =
        Object.entries(
            commandData
        )
        .filter(
            ([name,data])=>{

                return (

                    !value ||

                    name.includes(
                        value
                    ) ||

                    data.aliases.some(
                        alias =>
                            alias.includes(
                                value
                            )
                    )

                );

            }
        );


    results.forEach(
        ([name,data],index)=>{

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "command";


            if(
                index === selectedCommand
            ){

                div.classList.add(
                    "selected"
                );

            }


            div.innerHTML = `

                <div class="commandName">
                    ${name}
                </div>

                <div class="commandUsage">
                    ${data.usage}
                </div>

                <div class="commandDescription">
                    ${data.description}
                </div>

            `;


            commandList.appendChild(
                div
            );

        }
    );

}


/* =========================================================
   OPEN COMMAND BROWSER
========================================================= */

function openBrowser(){

    mode =
        "browser";


    browser.style.display =
        "flex";


    search.value =
        "";


    selectedCommand =
        0;


    refreshCommands();


    search.focus();

}


/* =========================================================
   EXECUTE COMMAND
========================================================= */

function executeCommand(
    raw
){

    raw =
        raw.trim();


    if(
        !raw
    ){

        return;

    }


    if(
        raw.startsWith(":")
    ){

        raw =
            raw.substring(1);

    }


    const parts =
        raw.split(
            /\s+/
        );


    const entered =
        parts
            .shift()
            .toLowerCase();


    const command =
        resolveCommand(
            entered
        );


    /*
        UNKNOWN COMMAND
    */

    if(
        !command
    ){

        playerMessage(
            ":" + raw
        );

        return;

    }


    const args =
        parts;


    history.push(
        ":" + raw
    );


    historyIndex =
        history.length;


    try{

        cmdSound.currentTime =
            0;

        cmdSound.play().catch(
            ()=>{}
        );

    }

    catch(e){}


    runCommand(
        command,
        args
    );

}


/* =========================================================
   RUN COMMAND
========================================================= */

function runCommand(
    command,
    args
){

    switch(
        command
    ){

        /* ================================================
           HINT
        ================================================ */

        case "h":{

            const message =
                args.join(" ");


            if(
                message
            ){

                showHint(
                    message
                );

            }

            break;

        }


        /* ================================================
           FULL SCREEN MESSAGE
        ================================================ */

        case "m":{

            const message =
                args.join(" ");


            if(
                message
            ){

                showMessage(
                    message
                );

            }

            break;

        }


        /* ================================================
           SWORD
        ================================================ */

        case "sword":{

            /*
                No image is supplied here yet,
                so the tool displays "Sword".
            */

            addTool(
                "Sword",
                "sword"
            );

            break;

        }


        /* ================================================
           F3X
        ================================================ */

        case "f3x":{

            /*
                Exactly ONE centered name.
            */

            addTool(
                "Building Tools",
                "f3x"
            );

            break;

        }


        /* ================================================
           BTOOLS
        ================================================ */

        case "btools":{

            addTool(
                "Delete",
                "delete"
            );

            addTool(
                "Clone",
                "clone"
            );

            addTool(
                "Move",
                "move"
            );

            break;

        }


        /* ================================================
           COMMANDS
        ================================================ */

        case "cmds":{

            openBrowser();

            break;

        }


        /* ================================================
           HELP
        ================================================ */

        case "help":{

            helpPanel.style.display =

                helpPanel.style.display ===
                "block"

                ? "none"

                : "block";

            break;

        }


        /*
            Other commands currently do nothing
            visually.

            IMPORTANT:
            There is NO fake:
            "[Kohl]: Command executed."
        */

        default:{

            break;

        }

    }

}


/* =========================================================
   HISTORY UP
========================================================= */

function historyUp(){

    if(
        !history.length
    ){

        return;

    }


    historyIndex =
        Math.max(
            0,
            historyIndex - 1
        );


    input.value =
        history[
            historyIndex
        ];


    moveCursorEnd();

}


/* =========================================================
   HISTORY DOWN
========================================================= */

function historyDown(){

    if(
        !history.length
    ){

        return;

    }


    historyIndex =
        Math.min(
            history.length,
            historyIndex + 1
        );


    if(
        historyIndex ===
        history.length
    ){

        input.value =
            "";

    }

    else{

        input.value =
            history[
                historyIndex
            ];

    }


    moveCursorEnd();

}


/* =========================================================
   TAB AUTOCOMPLETE
========================================================= */

function autocomplete(){

    const value =
        input.value;


    if(
        !value.startsWith(":")
    ){

        return;

    }


    const typed =
        value
            .substring(1)
            .split(
                /\s+/
            )[0]
            .toLowerCase();


    if(
        !typed
    ){

        return;

    }


    const match =
        Object.keys(
            commandData
        )
        .find(
            command =>
                command.startsWith(
                    typed
                )
        );


    if(
        match
    ){

        input.value =
            ":" + match;


        moveCursorEnd();

    }

}


/* =========================================================
   MOVE CURSOR TO END
========================================================= */

function moveCursorEnd(){

    setTimeout(
        ()=>{

            input.selectionStart =
                input.selectionEnd =
                    input.value.length;

        },
        0
    );

}


/* =========================================================
   CHAT INPUT
========================================================= */

input.addEventListener(
    "keydown",
    e=>{

        /* ENTER */

        if(
            e.key === "Enter"
        ){

            const value =
                input.value.trim();


            if(
                value
            ){

                if(
                    value.startsWith(":")
                ){

                    executeCommand(
                        value
                    );

                }

                else{

                    playerMessage(
                        value
                    );


                    history.push(
                        value
                    );


                    historyIndex =
                        history.length;

                }

            }


            input.value =
                "";

            e.preventDefault();

            return;

        }


        /* UP */

        if(
            e.key === "ArrowUp"
        ){

            historyUp();

            e.preventDefault();

            return;

        }


        /* DOWN */

        if(
            e.key === "ArrowDown"
        ){

            historyDown();

            e.preventDefault();

            return;

        }


        /* TAB */

        if(
            e.key === "Tab"
        ){

            autocomplete();

            e.preventDefault();

            return;

        }

    }
);


/* =========================================================
   GLOBAL HOTKEYS
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        /*
            If command browser is open,
            normal hotkeys don't interfere.
        */

        if(
            mode === "browser"
        ){

            return;

        }


        /*
            If typing directly into chat,
            don't create another input.
        */

        if(
            document.activeElement ===
            input
        ){

            return;

        }


        /* : */

        if(
            e.key === ":"
        ){

            input.value =
                ":";


            input.focus();


            moveCursorEnd();


            e.preventDefault();

        }


        /* / */

        else if(
            e.key === "/"
        ){

            input.focus();

            e.preventDefault();

        }


        /* { */

        else if(
            e.key === "{"
        ){

            openBrowser();

            e.preventDefault();

        }


        /* ñ */

        else if(
            e.key.toLowerCase() ===
            "ñ"
        ){

            openBrowser();

            e.preventDefault();

        }

    }
);


/* =========================================================
   BROWSER SEARCH
========================================================= */

search.addEventListener(
    "input",
    ()=>{

        selectedCommand =
            0;


        refreshCommands(
            search.value
        );

    }
);


/* =========================================================
   BROWSER KEYBOARD CONTROLS
========================================================= */

search.addEventListener(
    "keydown",
    e=>{

        /*
            ENTER:
            execute and close.
        */

        if(
            e.key === "Enter"
        ){

            const value =
                search.value.trim();


            if(
                value
            ){

                executeCommand(
                    value
                );

            }


            browser.style.display =
                "none";


            mode =
                "chat";


            input.focus();


            e.preventDefault();

            return;

        }


        /* DOWN */

        if(
            e.key === "ArrowDown"
        ){

            selectedCommand++;


            refreshCommands(
                search.value
            );


            e.preventDefault();

        }


        /* UP */

        if(
            e.key === "ArrowUp"
        ){

            selectedCommand =
                Math.max(
                    0,
                    selectedCommand - 1
                );


            refreshCommands(
                search.value
            );


            e.preventDefault();

        }


        /*
            ESC DOES NOTHING.
            You must execute a command
            to leave browser mode.
        */

    }
);


/* =========================================================
   STARTUP MESSAGE
========================================================= */

setTimeout(
    ()=>{

        addMessage(
            "Please chat '/?' for a list of commands"
        );

    },
    500
);


/* =========================================================
   INITIAL INVENTORY
========================================================= */

renderInventory();

</script>
