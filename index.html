<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Kohl's Admin Simulator</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    overflow:hidden;
    background:url("https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1920") center center/cover;
    height:100vh;
}

/* 2019 TOPBAR */

#topbar{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:36px;
    background:rgba(30,30,30,.75);
    color:white;
    display:flex;
    align-items:center;
    z-index:1000;
}

.icon{
    width:36px;
    text-align:center;
    font-size:20px;
    cursor:pointer;
}

/* CHAT */

#chat{
    position:absolute;
    top:45px;
    left:10px;
    width:420px;
}

.chatMessage{
    color:white;
    text-shadow:2px 2px 3px black;
    margin-bottom:4px;
    opacity:0;
    transform:translateY(5px);
    animation:appear .2s forwards;
}

@keyframes appear{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

#chatInput{
    position:absolute;
    bottom:15px;
    left:10px;
    width:500px;
    padding:8px;
    border:none;
    background:rgba(255,255,255,.7);
    display:none;
}

/* PLAYERLIST */

#players{
    position:absolute;
    top:40px;
    right:10px;
    width:180px;
    background:rgba(0,0,0,.4);
    color:white;
    padding:10px;
}

/* WELCOME */

#welcome{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    color:white;
    text-align:center;
    text-shadow:2px 2px 6px black;
    animation:welcomeAnim 6s forwards;
}

@keyframes welcomeAnim{
    0%{
        opacity:0;
        transform:scale(.8);
    }

    15%{
        opacity:1;
        transform:scale(1);
    }

    80%{
        opacity:1;
    }

    100%{
        opacity:0;
        pointer-events:none;
    }
}

/* COMMAND BROWSER */

#browser{
    position:absolute;
    inset:0;
    background:rgba(0,0,0,.45);
    display:none;
    justify-content:center;
    align-items:center;
}

#browserBox{
    width:700px;
    height:500px;
    background:rgba(0,0,0,.35);
    color:white;
    overflow:auto;
    padding:15px;
}

#search{
    width:100%;
    padding:10px;
    margin-bottom:15px;
}

.command{
    padding:5px;
}
</style>
</head>

<body>

<div id="topbar">
    <div class="icon">☰</div>
    <div class="icon">💬</div>
    <div class="icon">🎒</div>
</div>

<div id="chat"></div>

<input id="chatInput" placeholder="Type here...">

<div id="players">
    <div>Player</div>
    <div>Guest666</div>
</div>

<div id="welcome">
    <h1>Kohl's Admin Infinite</h1>
    <br>
    <div>Welcome!</div>
    <br>
    <div>You're a Game Creator!</div>
    <div>Chat :cmds for all commands</div>
    <div>Chat :help for general usage</div>
    <div>Enjoy the admin!</div>
</div>

<div id="browser">
    <div id="browserBox">

        <input
        id="search"
        placeholder="Search Command">

        <div id="commandList"></div>

    </div>
</div>

<audio id="cmdSound"
src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg">
</audio>

<script>

const commands = [
"kill",
"heal",
"speed",
"bring",
"tp",
"ff",
"unff",
"sparkles",
"unsparkles",
"fire",
"unfire",
"smoke",
"unsmoke",
"explode",
"music",
"stopmusic",
"god",
"ungod",
"fly",
"unfly",
"noclip",
"clip",
"sit",
"jump",
"cmds",
"help"
];

const chat = document.getElementById("chat");
const input = document.getElementById("chatInput");
const browser = document.getElementById("browser");
const commandList = document.getElementById("commandList");

function addMessage(text){

    const div = document.createElement("div");
    div.className = "chatMessage";
    div.textContent = text;

    chat.appendChild(div);

    if(chat.children.length > 15){
        chat.removeChild(chat.firstChild);
    }
}

function refreshCommands(filter=""){

    commandList.innerHTML = "";

    commands
    .filter(x=>x.includes(filter.toLowerCase()))
    .forEach(cmd=>{

        let div = document.createElement("div");

        div.className = "command";

        div.innerHTML =
        `<b>${cmd}</b><br>
        Kohl's Admin Command`;

        commandList.appendChild(div);
    });
}

refreshCommands();

document.addEventListener("keydown",(e)=>{

    if(e.key === ":"){

        input.style.display="block";
        input.focus();
        input.value=":";
    }

    if(e.key === "{"){
        browser.style.display="flex";
        document.getElementById("search").focus();
    }

    if(e.key === "Escape"){
        browser.style.display="none";
        input.style.display="none";
    }

});

input.addEventListener("keydown",(e)=>{

    if(e.key === "Enter"){

        let txt = input.value;

        addMessage("[Player]: " + txt);

        if(txt.startsWith(":")){

            document
            .getElementById("cmdSound")
            .play();

            addMessage(
            "[Kohl]: Command executed."
            );
        }

        input.value="";
    }
});

document
.getElementById("search")
.addEventListener("input",(e)=>{

    refreshCommands(
    e.target.value
    );
});

addMessage(
"Please chat '/?' for a list of commands"
);

</script>

</body>
</html>
